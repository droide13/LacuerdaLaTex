<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor LaCuerda a LaTeX (Cancionero)</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
<div class="max-w-5xl mx-auto space-y-6">
  <header class="text-center space-y-2">
    <h1 class="text-3xl font-bold text-amber-500">🎸 LaCuerda a LaTeX</h1>
    <p class="text-slate-400">Pega el enlace de LaCuerda (o el texto con acordes) y genera código con tu plantilla (<code>\chord{}</code>, <code>tablatura</code>).</p>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700">
      <h2 class="text-xl font-semibold text-amber-400">1. Entrada</h2>
      <label class="block text-sm text-slate-300">URL de LaCuerda:</label>
      <input type="url" id="inputUrl" placeholder="https://acordes.lacuerda.net/artista/cancion.shtml"
        class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm">
      <button id="btnCargar" onclick="cargarDesdeUrl()"
        class="w-full py-3 bg-amber-600 hover:bg-amber-500 font-semibold rounded-lg text-slate-950">Obtener y convertir</button>
      <p id="estado" class="text-xs text-slate-400 min-h-[1rem]"></p>

      <div class="flex items-center gap-3 text-xs text-slate-500">
        <div class="flex-grow border-t border-slate-700"></div>O PEGA EL TEXTO<div class="flex-grow border-t border-slate-700"></div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="inputTitulo" placeholder="Título" class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs">
        <input type="text" id="inputArtista" placeholder="Artista" class="p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs">
      </div>
      <textarea id="inputSong" rows="10" spellcheck="false"
        class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none font-mono text-xs"
        placeholder="Pega aquí la canción tal como aparece en LaCuerda (acordes encima de la letra)..."></textarea>
      <label class="flex items-center gap-2 text-sm text-slate-300">
        <input type="checkbox" id="chkCompleto" checked> Incluir preámbulo (documento completo)
      </label>
      <label class="flex items-center gap-2 text-sm text-slate-300">
        <input type="checkbox" id="chkCols" checked> Dos columnas
      </label>
      <label class="flex items-center gap-2 text-sm text-slate-300">
        <input type="checkbox" id="chkBlank"> Cortar párrafo en cada línea en blanco
      </label>
    </div>

    <div class="space-y-4 bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-amber-400">2. Código LaTeX</h2>
        <button onclick="copiar()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded font-medium">Copiar</button>
      </div>
      <textarea id="outputLaTeX" rows="20" readonly spellcheck="false"
        class="w-full flex-grow p-3 bg-slate-950 border border-slate-800 rounded-lg font-mono text-xs text-amber-200"
        placeholder="El código generado aparecerá aquí..."></textarea>
    </div>
  </div>
</div>

<script>
// ---------- Reconocimiento de acordes ----------
const CHORD = /^[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|\+|°|º)?(?:[0-9]{1,2}|[#b+-][0-9]{1,2}|sus[24]?|add[0-9]{1,2}|maj[0-9]{1,2}|dim|aug|\([^)]*\))*(?:\/[A-G][#b]?)?$/;
const FILLER = /^(?:\||\|\||\/|-|%|\(?x\d+\)?|\(?\d+x\)?)$/i;
const SECTION = /^[\[(]?\s*(intro|estribillo|coro|pre-?coro|puente|verso|estrofa|solo|interludio|outro|final|instrumental)([\s\d]*)(?:x\d+)?[\])]?\s*:?\s*(.*)$/i;
const TABRE = /(?:^|\s)([A-Ga-g]?\|[-0-9hpbrxs\/\\~()^|*.]{6,})\s*$/;
const $ = id => document.getElementById(id);

const PREAMBULO = String.raw`\documentclass[a4paper,11pt]{article}

\usepackage[utf8]{inputenc}
\usepackage[T1]{fontenc}
\usepackage[left=1.6cm, right=1.6cm, top=1.8cm, bottom=2cm]{geometry}
\usepackage{multicol}
\setlength{\columnsep}{0.9cm}
\usepackage{setspace}
\setstretch{1.0}
\setlength{\parskip}{0.25em}
\setlength{\parindent}{0pt}
\usepackage[dvipsnames]{xcolor}
\definecolor{acorde}{RGB}{160,90,20}
\definecolor{titulo}{RGB}{20,20,20}
\definecolor{gris}{RGB}{110,110,110}
\usepackage{fancyhdr}
\pagestyle{fancy}
\fancyhf{}
\fancyfoot[C]{\small\thepage}
\renewcommand{\headrulewidth}{0pt}
\renewcommand{\footrulewidth}{0pt}
\fancypagestyle{plain}{\fancyhf{}\fancyfoot[C]{\small\thepage}\renewcommand{\headrulewidth}{0pt}}
\usepackage{titlesec}
\titleformat{\section}[block]
  {\large\bfseries\color{titulo}}
  {}{0pt}{}[\vspace{-0.4em}\rule{\linewidth}{0.6pt}]
\usepackage{alltt}
\usepackage{mdframed}
\mdfdefinestyle{tabstyle}{%
  backgroundcolor=black!4,linecolor=black!15,linewidth=0.5pt,
  topline=true,bottomline=true,leftline=false,rightline=false,
  innertopmargin=5pt,innerbottommargin=5pt,
  innerleftmargin=8pt,innerrightmargin=8pt,
  skipabove=6pt,skipbelow=4pt}
\newenvironment{tablatura}{%
  \begin{mdframed}[style=tabstyle]\begin{alltt}\scriptsize\setstretch{1.3}%
}{\end{alltt}\end{mdframed}}
\usepackage[hidelinks,bookmarks=true]{hyperref}
\newcommand{\chord}[1]{\makebox[0pt][l]{\raisebox{1.0em}{\textbf{\textcolor{acorde}{\small #1}}}}}
`;

function esAcordes(l) {
  const t = l.match(/[^\s-]+/g) || [];
  if (!t.length) return false;
  let n = 0;
  for (const x of t) { if (CHORD.test(x)) n++; else if (!FILLER.test(x)) return false; }
  return n > 0;
}
function seccion(l) {
  const m = l.trim().match(SECTION);
  return m && (m[3].trim() === '' || esAcordes(m[3])) ? m : null;
}
function esc(s) {
  const map = { '\\': '\\textbackslash{}', '~': '\\textasciitilde{}', '^': '\\textasciicircum{}' };
  return s.replace(/[\\{}&%$#_~^]/g, c => map[c] || '\\' + c);
}
const ch = c => '\\chord{' + c.replace(/#/g, '\\#') + '}';

// Acordes de la línea superior -> \chord{X} colocado en la columna de la letra
function mezclar(acordes, letra) {
  const pos = [], re = /[^\s-]+/g;
  let m;
  while ((m = re.exec(acordes))) if (CHORD.test(m[0])) pos.push([m.index, m[0]]);
  letra = letra.replace(/\s+$/, '');
  letra = letra.padEnd(Math.max(...pos.map(p => p[0])));
  let out = esc(letra.slice(0, pos[0][0]));
  pos.forEach(([p, c], k) => {
    const seg = letra.slice(p, k + 1 < pos.length ? pos[k + 1][0] : undefined);
    out += ch(c) + esc(seg);
    // ancho aprox. del acorde (negrita pequeña) frente al de la letra: evita que se pisen
    const falta = c.length * 0.8 + 0.6 - seg.length * 0.42;
    if (k + 1 < pos.length && falta > 0) out += '\\hspace*{' + falta.toFixed(1) + 'em}';
  });
  return out.replace(/\s+$/, '');
}
function soloAcordes(l) {
  return (l.match(/[^\s-]+/g) || []).filter(x => CHORD.test(x)).map(c => ch(c) + '\\hspace*{' + (c.length * 0.6 + 1).toFixed(1) + 'em}').join('');
}
function corchetes(l) {   // "Hola [Am]mundo"
  let out = '', last = 0;
  l.replace(/\[([^\]]+)\]/g, (m, c, idx) => {
    if (!CHORD.test(c)) return m;
    out += esc(l.slice(last, idx)) + ch(c); last = idx + m.length; return m;
  });
  return out + esc(l.slice(last));
}

// ---------- Entrada: texto plano O código fuente HTML pegado ----------
const limpio = e => e ? e.textContent.replace(/\s+/g, ' ').trim() : '';
function extraer(entrada) {
  if (/<pre[\s>]|<html|<!doctype/i.test(entrada)) {
    const doc = new DOMParser().parseFromString(entrada, 'text/html');
    const pre = doc.querySelector('#t_body pre') || doc.querySelector('pre');
    if (pre) return { texto: pre.textContent, titulo: limpio(doc.querySelector('h1')), artista: limpio(doc.querySelector('h2')) };
  }
  return { texto: entrada, titulo: '', artista: '' };
}

// ---------- Conversión ----------
function parsear(texto) {
  const items = texto.replace(/\r/g, '').replace(/\u00a0/g, ' ').replace(/\t/g, '    ').split('\n').map(l => {
    const m = l.match(TABRE);
    return m ? { text: l.slice(0, m.index).replace(/\s+$/, ''), tab: m[1] } : { text: l.replace(/\s+$/, ''), tab: null };
  });
  const cortaPorBlanco = $('chkBlank').checked;
  const bloques = [];
  let cur = [], tabs = [], kind = 'verse', note = '', blancos = 0;
  const flushTabs = () => { if (tabs.length) { cur.push({ tabs }); tabs = []; } };
  const flush = () => {
    flushTabs();
    if (cur.length) { bloques.push({ kind, note, lines: cur }); cur = []; kind = 'verse'; note = ''; }
  };

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    let l = it.text;
    if (!l.trim() && !it.tab) { blancos++; if (cortaPorBlanco || blancos >= 2) flush(); continue; }
    blancos = 0;
    if (!l.trim()) { tabs.push(it.tab); continue; }   // línea solo-tab

    const s = seccion(l);
    if (s) {
      flush();
      if (/^(estribillo|coro)$/i.test(s[1])) kind = 'chorus';
      else { const e = (s[1] + s[2]).trim(); note = e.charAt(0).toUpperCase() + e.slice(1).toLowerCase(); }
      if (it.tab) tabs.push(it.tab);
      if (!s[3].trim()) continue;
      l = s[3];
    }
    if (!it.tab) flushTabs();   // una tablatura es una racha de líneas con tab

    if (esAcordes(l)) {
      let j = i + 1;
      while (j < items.length && !items[j].text.trim() && items[j].tab) j++;
      const nx = items[j];
      if (it.tab) tabs.push(it.tab);
      if (nx && nx.text.trim() && !esAcordes(nx.text) && !seccion(nx.text)) {
        for (let k = i + 1; k < j; k++) tabs.push(items[k].tab);
        cur.push({ tex: mezclar(l, nx.text) });
        if (nx.tab) tabs.push(nx.tab);
        i = j;
      } else cur.push({ tex: soloAcordes(l) });
    } else {
      cur.push({ tex: corchetes(l) });
      if (it.tab) tabs.push(it.tab);
    }
  }
  flush();
  return bloques;
}

function renderBloque(b) {
  let out = '', buf = [];
  if (b.kind === 'chorus') buf.push('\\textit{\\textcolor{gris}{Estribillo}}');
  else if (b.note) buf.push('\\textit{\\textcolor{gris}{' + esc(b.note) + '}}');
  const fl = () => { if (buf.length) { out += buf.join(' \\\\[0.9em]\n') + '\n\n'; buf = []; } };
  for (const s of b.lines) {
    if (s.tabs) {
      fl();
      const t = s.tabs.map(x => x.trim());
      const pequeno = $('chkCols').checked && Math.max(...t.map(x => x.length)) > 50 ? '\\tiny ' : '';
      out += '\\begin{tablatura}\n' + pequeno + t.map(x => x.replace(/\\/g, '\\textbackslash{}').replace(/[{}]/g, '\\$&')).join('\n') + '\n\\end{tablatura}\n\n';
    } else buf.push(s.tex);
  }
  fl();
  return out;
}

function generar(texto, titulo, artista) {
  let cuerpo = `\\section{${esc(titulo || 'Título')}}\n{\\color{gris}\\small ${esc(artista || 'Artista')}}\\par\n\n`;
  const bl = parsear(texto).map(renderBloque).join('');
  cuerpo += $('chkCols').checked ? `\\begin{multicols}{2}\n${bl}\\end{multicols}\n` : bl;
  if (!$('chkCompleto').checked) return cuerpo;
  return PREAMBULO + '\n\\begin{document}\n\n' + cuerpo + '\n\\end{document}\n';
}

function convertirManual() {
  const e = extraer($('inputSong').value);
  if (!e.texto.trim()) { $('outputLaTeX').value = ''; return; }
  const t = $('inputTitulo').value.trim() || e.titulo;
  const a = $('inputArtista').value.trim() || e.artista;
  $('outputLaTeX').value = generar(e.texto, t, a);
}

// ---------- Descarga desde URL (con varios proxies CORS de respaldo) ----------
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`
];

async function descargar(url) {
  let ultimo = new Error('Sin respuesta');
  for (const p of PROXIES) {
    try {
      const r = await fetch(p(url));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const buf = await r.arrayBuffer();
      let t = new TextDecoder('utf-8').decode(buf);
      if (t.includes('\uFFFD')) t = new TextDecoder('windows-1252').decode(buf);
      if (t.length < 500) throw new Error('Respuesta vacía');
      return t;
    } catch (e) { ultimo = e; }
  }
  throw ultimo;
}

async function cargarDesdeUrl() {
  const url = $('inputUrl').value.trim();
  if (!url) { convertirManual(); return; }
  const btn = $('btnCargar');
  btn.disabled = true;
  $('estado').textContent = 'Descargando página...';
  try {
    const html = await descargar(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const pre = doc.querySelector('#t_body pre') || doc.querySelector('pre');
    if (!pre) throw new Error('No se encontró el bloque de la canción');
    $('inputTitulo').value = (doc.querySelector('h1')?.textContent || '').trim();
    $('inputArtista').value = (doc.querySelector('h2')?.textContent || '').trim();
    $('inputSong').value = pre.textContent;
    convertirManual();
    $('estado').textContent = 'Listo. Revisa el resultado.';
  } catch (e) {
    console.error(e);
    $('estado').textContent = 'No se pudo descargar (' + e.message + '). Copia y pega el texto de la canción abajo.';
  } finally {
    btn.disabled = false;
  }
}

function copiar() {
  const o = $('outputLaTeX');
  if (!o.value) return;
  navigator.clipboard.writeText(o.value).then(() => { $('estado').textContent = '¡Código copiado!'; });
}

['inputSong','inputTitulo','inputArtista'].forEach(id => $(id).addEventListener('input', convertirManual));
['chkCompleto','chkCols','chkBlank'].forEach(id => $(id).addEventListener('change', convertirManual));
</script>
</body>
</html>
